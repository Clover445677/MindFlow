<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindFlow 🧠</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MindFlow</h1>
        <button id="theme-toggle">🌙</button>
    </header>

    <main>
        <form id="add-habit">
            <h2>Добавить привычку</h2>
            <input type="text" id="habit-name" placeholder="Название привычки">
            <select id="habit-frequency">
                <option value="daily">Ежедневно</option>
                <option value="weekly">Еженедельно</option>
             <label>
                <input type="radio" name="habit-type" value="positive" checked>
                Позитивная
                <input type="radio" name="habit-type" value="negative">
                Негативная
            </label>
            </select>
            </select>
            </select>
            <button type="submit" id="add-habit-btn">Добавить</button>
        </form>
    </section>

        <section id="habit-list">
            <h2>Привычки</h2>
            <ul id="habits"></ul>
        </section>

        <section id="stats">
            <h2>Статистика</h2>
            <div id="weekly-stats"></div>
        </section>

        <button id="reset-btn">Сбросить все данные</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
